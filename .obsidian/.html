<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #target-zone {
      position: fixed;
      width: 15px;
      height: 15px;
      border-radius: 0.6rem;
      background: #f7f7f7;
      transition: left 1s ease, top 1s ease;
      cursor: pointer;
    }

    #password-input {
      position: fixed;
      left: -10000px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

  </style>
</head>
<body>
  <div id="target-zone" aria-hidden="true"></div>
  <input id="password-input" type="password" autocomplete="off" aria-label="Password" />

  <script>
    const correctPassword = "cutebaby";
    let targetZone = document.querySelector("#target-zone");
    const passwordInput = document.querySelector("#password-input");
    let zonePosition;

    function moveTargetZone() {
      const maxLeft = window.innerWidth - targetZone.offsetWidth;
      const maxTop = window.innerHeight - targetZone.offsetHeight;
      const movementRange = 500;

      if (!zonePosition) {
        zonePosition = {
          left: Math.random() * Math.max(maxLeft, 0),
          top: Math.random() * Math.max(maxTop, 0)
        };
      } else {
        zonePosition.left = Math.min(
          Math.max(zonePosition.left + (Math.random() * 2 - 1) * movementRange, 0),
          Math.max(maxLeft, 0)
        );
        zonePosition.top = Math.min(
          Math.max(zonePosition.top + (Math.random() * 2 - 1) * movementRange, 0),
          Math.max(maxTop, 0)
        );
      }

      targetZone.style.left = `${zonePosition.left}px`;
      targetZone.style.top = `${zonePosition.top}px`;
    }

    moveTargetZone();
    window.addEventListener("resize", () => {
      moveTargetZone();
    });
    window.setInterval(moveTargetZone, 5000);

    targetZone.addEventListener("click", () => {
      passwordInput.value = "";
      passwordInput.focus();
    });

    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        if (passwordInput.value === correctPassword) {
        document.body.innerHTML = `
          <a id="target-zone" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="Open YouTube">
          </a>
        `;
        targetZone = document.querySelector("#target-zone");
        moveTargetZone();
        document.title = "YouTube";
        } else {
          passwordInput.value = "";
        }
      }
    });
  </script>
</body>
</html>
